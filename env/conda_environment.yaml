name: adf_v1.0.6
channels:
  - conda-forge
  - defaults
dependencies:
  - pyyaml=6.0.2
  - scipy=1.12.0
  - cartopy=0.23.0
  - netcdf4=1.6.5
  - xarray=2024.1.1
  # 2025.6.0 is the first release with "UxDataArray.to_raster", which the
  # native-grid (unstructured) maps in lib/plotting_functions.py use.
  - uxarray=2026.10.0
  - matplotlib=3.9.4
  - pandas=2.2.0
  - pint=0.23
  - geocat-comp=2024.04.0
  - python=3.12
  - xesmf>=0.8.8
  # Wasserstein-distance option of cloud_regime_analysis. Not needed for its
  # default (euclidean) mode, nor by any other diagnostic.
  - pot
  - joblib
  # Development tool, not needed to run the ADF.  "pre-commit" is what
  # the "ADF_pre-commit.yaml" CI workflow runs, and it installs the exact
  # "black" version pinned in ".pre-commit-config.yaml" into its own
  # isolated environment, so a local "pre-commit run -a" reproduces the
  # CI formatting check without pinning "black" a second time here.
  - pre-commit>=3.5
  # Development tools, not needed to run the ADF.  "pylint" and "pytest"
  # are what the "ADF_linting.yaml" and "ADF_unit_tests.yaml" CI workflows
  # run (CI installs the latest release; these are the versions current
  # when this environment was tested).  "astroid" is pylint's parser and
  # is pinned with it, since the two are released in lockstep.
  - pylint=4.1.3
  - astroid=4.3.4
  - pytest=9.1.1
