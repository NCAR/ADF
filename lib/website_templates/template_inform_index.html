<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Diagnostics Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

.tabBar{

    display:flex;

    gap:10px;

    padding:10px;

    border-bottom:1px solid #ddd;

}


.tabContent{

    flex:1;

    overflow:auto;

    min-height:0;

}


.tabContent:not(.active){

    display:none !important;

}


.tabContent.active{

    display:flex;

    min-height:0;

}

body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow:auto;
}

.header{
    padding:15px 20px;
    border-bottom:1px solid #ddd;
    background:#f8f8f8;
}

.header h1{
    margin:0;
}

.controls{
    display:flex;
    gap:20px;
    padding:15px 20px;
    border-bottom:1px solid #ddd;
    background:#fafafa;
}

.controls select{
    min-width:300px;
    padding:5px;
}

.dashboard{

    display:flex;

    height:calc(100vh - 130px);

    overflow:hidden;

}

.sidebar{
    width:400px;

    border-right:1px solid #ddd;

    overflow-y:auto;

    padding:10px;
}

.sidebar h2{
    margin-top:0;
}

.thumb{

    margin-bottom:15px;

    border:1px solid #ddd;

    padding:5px;

    background:white;
}

.thumb img{

    width:100%;

    display:block;

    cursor:pointer;
}

.thumbLabel{

    margin-top:5px;

    font-size:11px;

    word-break:break-word;
}

.mainpanel{

    flex:1;

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

.previewPane{

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:10px;

}

#mainImage{

    max-width:100%;

    max-height:100%;
}

.workspace{

    flex:1;

    display:flex;

    flex-direction:column;

    overflow:hidden;
}

.workspaceHeader{

    padding:10px;

    border-bottom:1px solid #ddd;

    display:flex;

    gap:10px;

    align-items:center;
}

.workspaceBody{

    flex:1;

    overflow:auto;

    padding:10px;
}

#panelGrid{

    display:grid;

    gap:10px;
}

#panelGrid img{

    width:100%;

    border:1px solid #ccc;

    display:block;
}

button{

    padding:8px 14px;

    cursor:pointer;
}

.info{

    margin-left:auto;

    color:#666;
}

.comparisonPane{

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding:20px;

    text-align:center;

}


#comparisonFigure{

    width:250px;

    min-width:250px;

}


#caseSlider{

    width:50%;

    margin:20px auto;

    height:20px;

}

#mosaicTab{

    flex-direction:column;

    min-height:0;

}

</style>

</head>

<body>

<div class="header">
    <h1>Diagnostics Dashboard</h1>
</div>

<div class="controls">

```
<div>
    Campaign<br>
    <select id="campaign"></select>
</div>

<div>
    Case<br>
    <select id="case"></select>
</div>
```

</div>

<div class="dashboard">

```
<div class="sidebar">

    <h2>Available Figures</h2>

    Category<br>

    <select id="figureCategory"></select>

    <br><br>

    <div id="thumbs"></div>

</div>

<div class="mainpanel">

    <div class="tabBar">

        <button onclick="showTab('previewTab')">
            Main Image
        </button>

        <button onclick="showTab('comparisonTab')">
            Case Slider
        </button>

        <button onclick="showTab('mosaicTab')">
            Mosaic
        </button>

    </div>


    <div id="previewTab" class="tabContent previewPane">

    <img id="mainImage">

</div>

<div id="comparisonTab" class="tabContent comparisonPane">

    <h2>Case Comparison</h2>

    Figure Type

    <select id="comparisonFigure"></select>

    <br><br>

    <input
        type="range"
        id="caseSlider"
        min="0"
        max="0"
        value="0"
        >

    <div id="sliderCaseLabel"></div>

    <br>

    <img
        id="comparisonImage"
        style="
            max-width:80%;
            max-height:70vh;
            border:1px solid #ccc;
        ">

</div>

<div id="mosaicTab" class="tabContent">

        <div class="workspaceHeader">

            <button id="clearSelection">
                Clear Selection
            </button>

            <button id="downloadMosaic">
                Download Mosaic PNG
            </button>

            <div class="info">
                Selected: <span id="selectedCount">0</span>
            </div>

        </div>

        <div class="workspaceBody">

            <div id="panelGrid"></div>

        </div>

    </div>

</div>
```

</div>

<canvas
 id="mosaicCanvas"
 style="display:none;"> </canvas>

<script>
const DEV_MODE = true;

let manifest = [];

let filtered = [];

const selected = new Set();

const campaignSelect =
    document.getElementById("campaign");

const caseSelect =
    document.getElementById("case");

const categorySelect =
    document.getElementById("figureCategory");

function unique(values){

    return [...new Set(values)].sort();

}

function updateSelectedCount(){

    document
        .getElementById("selectedCount")
        .textContent =
            selected.size;

}
async function init(){

    if(DEV_MODE){

        const response =
            await fetch("manifest_test.json");

        manifest =
            await response.json();

    }else{

    manifest = [];

}

    populateCampaigns();
    populateCases();
    populateFigureCategories();
    updateFigures();
    populateComparisonFigure();
    updateCaseComparison();

}


function populateFigureCategories(){

    const categories =
        new Set();

    manifest
        .forEach(entry => {

            entry.urls.forEach(fig => {

                if(fig.category){
                    categories.add(fig.category);
                }

            });

        });


    categorySelect.innerHTML = "";


    const all =
        document.createElement("option");

    all.value = "All";
    all.textContent = "All Figures";

    categorySelect.appendChild(all);


    [...categories]
        .sort()
        .forEach(cat => {

            const opt =
                document.createElement("option");

            opt.value = cat;
            opt.textContent = cat;

            categorySelect.appendChild(opt);

        });

}

function populateCampaigns(){

    const campaigns =
        unique(
            manifest.map(
                d => d.campaign
            )
        );

    campaignSelect.innerHTML = "";

    campaigns.forEach(c => {

        const opt =
            document.createElement(
                "option"
            );

        opt.value = c;
        opt.textContent = c;

        campaignSelect.appendChild(
            opt
        );

    });

}

function populateCases(){

    const campaign =
        campaignSelect.value;

    const cases =
        unique(
            manifest
                .filter(
                    d =>
                    d.campaign === campaign
                )
                .map(
                    d => d.case
                )
        );

    caseSelect.innerHTML = "";

    cases.forEach(c => {

        const opt =
            document.createElement(
                "option"
            );

        opt.value = c;
        opt.textContent = c;

        caseSelect.appendChild(
            opt
        );

    });

}

function updateFigures(){

    const campaign =
        campaignSelect.value;

    const caseName =
        caseSelect.value;

    filtered =
        manifest.filter(
            d =>
                d.campaign === campaign &&
                d.case === caseName
        );

    renderThumbnails();

}

function renderThumbnails(){

    const thumbs =
        document.getElementById(
            "thumbs"
        );

    thumbs.innerHTML = "";

    const selectedCategory =
    categorySelect.value;


    filtered.forEach(group => {

        group.urls
        .filter(fig => {

            if(selectedCategory === "All"){
                return true;
            }

            return fig.category === selectedCategory;

        })
        .forEach(fig => {
            console.log("FIG OBJECT:", fig);

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "thumb";

            const check =
                document.createElement(
                    "input"
                );

            check.type =
                "checkbox";

            check.checked =
                selected.has(fig.url);

            const img =
                document.createElement(
                    "img"
                );

            img.src = fig.url;

            img.onclick = () => {

                document
                    .getElementById(
                        "mainImage"
                    )
                    .src = fig.url;

            };

            check.onchange = () => {

                if(
                    selected.has(fig.url)
                ){

                    selected.delete(
                        fig.url
                    );

                }else{

                    selected.add(
                        fig.url
                    );

                }

                renderPanel();

            };

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "thumbLabel";

            label.textContent =
                fig.type;

            div.appendChild(check);
            div.appendChild(img);
            div.appendChild(label);

            thumbs.appendChild(div);

        });

    });

    if(
        filtered.length &&
        filtered[0].urls.length
    ){

        document
            .getElementById(
                "mainImage"
            )
            .src =
                filtered[0]
                    .urls[0];

    }

}

function renderPanel(){

    const panel =
        document.getElementById(
            "panelGrid"
        );

    panel.innerHTML = "";

    const urls =
        [...selected];

    const n =
        urls.length;

    let cols;

    if(n <= 1){

        cols = 1;

    }else if(n <= 4){

        cols = 2;

    }else if(n <= 9){

        cols = 3;

    }else{

        cols = 4;

    }

    panel.style.gridTemplateColumns =
        `repeat(${cols}, 1fr)`;

    urls.forEach(url => {

        const img =
            document.createElement(
                "img"
            );

        img.src = url;

        panel.appendChild(
            img
        );

    });

    updateSelectedCount();

}

function loadImage(src){

    return new Promise(
        resolve => {

            const img =
                new Image();

            img.onload =
                () =>
                resolve(img);

            img.src =
                src;

        }
    );

}

document
.getElementById(
    "downloadMosaic"
)
.onclick =
async () => {

    const urls =
        [...selected];

    if(
        urls.length === 0
    ){
        return;
    }

    const images =
        await Promise.all(
            urls.map(
                loadImage
            )
        );

    const cols =
        Math.ceil(
            Math.sqrt(
                images.length
            )
        );

    const rows =
        Math.ceil(
            images.length /
            cols
        );

    const panelWidth =
        1200;

    const panelHeight =
        900;

    const canvas =
        document.getElementById(
            "mosaicCanvas"
        );

    canvas.width =
        cols *
        panelWidth;

    canvas.height =
        rows *
        panelHeight;

    const ctx =
        canvas.getContext(
            "2d"
        );

    images.forEach(
        (img,i) => {

            const row =
                Math.floor(
                    i / cols
                );

            const col =
                i % cols;

            ctx.drawImage(
                img,
                col *
                panelWidth,
                row *
                panelHeight,
                panelWidth,
                panelHeight
            );

        }
    );

    const link =
        document.createElement(
            "a"
        );

    link.download =
        "diagnostic_mosaic.png";

    link.href =
        canvas.toDataURL(
            "image/png"
        );

    link.click();

};

campaignSelect.onchange =
() => {

    populateCases();

    updateFigures();

    populateComparisonFigure();

    updateCaseComparison();

};

caseSelect.onchange =
    updateFigures;

categorySelect.onchange =
    renderThumbnails;

document
.getElementById(
    "clearSelection"
)
.onclick =
() => {

    selected.clear();

    renderPanel();

    renderThumbnails();

};




function populateComparisonFigure(){

    const campaign =
        campaignSelect.value;

    const types =
        new Set();

    manifest
        .filter(
            d =>
            d.campaign === campaign
        )
        .forEach(entry => {

            entry.urls.forEach(fig => {

                types.add(
                    fig.type
                );

            });

        });

    const select =
        document.getElementById(
            "comparisonFigure"
        );

    select.innerHTML = "";

    [...types]
        .sort()
        .forEach(type => {

            const opt =
                document.createElement(
                    "option"
                );

            opt.value =
                type;

            opt.textContent =
                type;

            select.appendChild(
                opt
            );

        });

}



function updateCaseComparison(){

    const campaign =
        campaignSelect.value;

    const figureType =
        document
        .getElementById(
            "comparisonFigure"
        )
        .value;

    const cases =
        manifest.filter(
            d =>
            d.campaign === campaign
        );

    const slider =
        document
        .getElementById(
            "caseSlider"
        );

    slider.max =
        cases.length - 1;

    const idx =
        parseInt(
            slider.value
        );

    const current =
        cases[idx];

    if(!current){
        return;
    }

    const figure =
        current.urls.find(
            f =>
            f.type === figureType
        );

    if(!figure){
        return;
    }

    document
        .getElementById(
            "sliderCaseLabel"
        )
        .textContent =
            current.case;

    document
        .getElementById(
            "comparisonImage"
        )
        .src =
            figure.url;

}





document
.getElementById(
    "comparisonFigure"
)
.onchange =
    updateCaseComparison;

document
.getElementById(
    "caseSlider"
)
.oninput =
    updateCaseComparison;


function showTab(tabName){

    document
        .querySelectorAll(".tabContent")
        .forEach(tab => {

            tab.classList.remove("active");

        });


    const tab =
        document.getElementById(tabName);

    tab.classList.add("active");


    if(tabName === "comparisonTab"){
        updateCaseComparison();
    }


    if(tabName === "mosaicTab"){

        renderPanel();

        tab.scrollTop = 0;

    }

}

showTab("previewTab");

init();
</script>

</body>
</html>
