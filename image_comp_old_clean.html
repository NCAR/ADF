<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Case Image Comparison with Multiple Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 { text-align: center; }

    .controls {
      text-align: center;
      margin-bottom: 20px;
    }

    .button-group {
      margin-bottom: 15px;
    }

    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
    }

    input {
      padding: 8px;
    }

    .url-input { width: 40%; }
    .label-input { width: 20%; }
    #filename { width: 30%; padding: 8px; }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }

    #imageGrid {
      display: grid;
      gap: 15px;
      justify-content: center;
      grid-auto-rows: minmax(250px, auto);
    }

    .case-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .case-label {
      max-width: 250px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(0.6rem, 2vw, 1rem);
      margin-bottom: 5px;
      cursor: default;
    }

    .image-box {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
      position: relative;
    }

    .image-box img {
      max-width: 100%;
      max-height: 90%;
      object-fit: contain;
      cursor: pointer;
    }

    .image-controls {
      position: absolute;
      top: 5px;
      right: 5px;
      display: flex;
      gap: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 95%;
      max-height: 95%;
    }

    .modal:active {
      display: none;
    }
  </style>
</head>
<body>

<h1>Multi-Case Image Comparison with Multiple Images</h1>

<div class="controls" id="dirContainer"></div>

<div class="controls">
  <div class="button-group">
    <button onclick="addInput()">+ Add Case</button>
    <button onclick="addImage()">+ Add Image</button>
  </div>

  <div class="filename-group">
    <input type="text" id="filename" placeholder="Enter image filename (e.g. Q_ANN_Zonal_Mean.png)">
  </div>

  <button onclick="compareImages()">Compare</button>
</div>

<div id="imageGrid" class="grid"></div>

<div id="modal" class="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
let sessionCache = { urls: [], labels: [], filenames: [] };
let imageFiles = [];

function cacheInput(url, label, filename) {
  if(url && !sessionCache.urls.includes(url)) sessionCache.urls.push(url);
  if(label && !sessionCache.labels.includes(label)) sessionCache.labels.push(label);
  if(filename && !sessionCache.filenames.includes(filename)) sessionCache.filenames.push(filename);
}

function addInput() {
  const container = document.getElementById('dirContainer');
  container.appendChild(createInputRow());
}

function createInputRow() {
  const div = document.createElement('div');
  div.className = 'input-row';

  const urlInput = document.createElement('input');
  urlInput.type = 'text';
  urlInput.placeholder = 'Enter assets directory URL';
  urlInput.className = 'url-input';

  const labelInput = document.createElement('input');
  labelInput.type = 'text';
  labelInput.placeholder = 'Optional label';
  labelInput.className = 'label-input';

  const delBtn = document.createElement('button');
  delBtn.textContent = '✖';
  delBtn.onclick = () => { div.remove(); compareImages(); };

  urlInput.oninput = () => { compareImages(); cacheInput(urlInput.value, labelInput.value, document.getElementById('filename').value); };
  labelInput.oninput = () => { compareImages(); cacheInput(urlInput.value, labelInput.value, document.getElementById('filename').value); };

  div.appendChild(urlInput);
  div.appendChild(labelInput);
  div.appendChild(delBtn);

  return div;
}

function addImage() {
  const filename = document.getElementById('filename').value.trim();
  if(filename && !imageFiles.includes(filename)) {
    imageFiles.push(filename);
    compareImages();
  }
}

function removeImage(file) {
  imageFiles = imageFiles.filter(f => f !== file);
  compareImages();
}

function toggleImage(file) {
  const imgElem = document.querySelector(`img[data-file='${file}']`);
  if(imgElem) imgElem.style.display = imgElem.style.display === 'none' ? '' : 'none';
}

window.onload = () => {
  if(document.getElementById('dirContainer').children.length === 0){
    addInput();
    addInput();
  }
};

function getAutoLabel(url) {
  if (url.endsWith('/')) url = url.slice(0, -1);
  const parts = url.split('/');
  const assetsIndex = parts.lastIndexOf('assets');
  if (assetsIndex > 0) return parts[assetsIndex - 1];
  return url;
}

function compareImages() {
  const rows = document.querySelectorAll('#dirContainer .input-row');
  const grid = document.getElementById('imageGrid');
  grid.innerHTML = '';

  const items = [];
  rows.forEach(row => {
    const urlInput = row.querySelector('.url-input');
    const labelInput = row.querySelector('.label-input');
    let dir = urlInput.value.trim();
    if(!dir) return;
    if(!dir.endsWith('/')) dir += '/';

    let label = labelInput.value.trim();
    if(!label) label = getAutoLabel(dir);

    imageFiles.forEach(file => {
      items.push({ url: dir + file, label, fullUrl: dir, file });
      cacheInput(dir, label, file);
    });
  });

  if(items.length === 0) return;
  const cols = Math.ceil(Math.sqrt(items.length));
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  items.forEach(item => {
    const caseDiv = document.createElement('div');
    caseDiv.className = 'case-container';

    const title = document.createElement('div');
    title.className = 'case-label';
    title.textContent = item.label;
    title.title = item.fullUrl;
    caseDiv.appendChild(title);

    const box = document.createElement('div');
    box.className = 'image-box';

    const img = document.createElement('img');
    img.src = item.url;
    img.dataset.file = item.file;
    img.onclick = () => openModal(item.url);

    const controlsDiv = document.createElement('div');
    controlsDiv.className = 'image-controls';

    const delBtn = document.createElement('button');
    delBtn.textContent = '✖';
    delBtn.onclick = (e) => { e.stopPropagation(); removeImage(item.file); };

    const hideBtn = document.createElement('button');
    hideBtn.textContent = '👁';
    hideBtn.onclick = (e) => { e.stopPropagation(); toggleImage(item.file); };

    controlsDiv.appendChild(delBtn);
    controlsDiv.appendChild(hideBtn);
    box.appendChild(img);
    box.appendChild(controlsDiv);

    caseDiv.appendChild(box);
    grid.appendChild(caseDiv);
  });
}

function openModal(src) {
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  modal.style.display = 'flex';
  modalImg.src = src;
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

document.getElementById('filename').addEventListener('input', () => {
  cacheInput('', '', document.getElementById('filename').value);
});
</script>

</body>
</html>
